<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    {% if error %}
        <p role="alert">{{ error }}</p>
    {% endif %}
    <form method="post">
        <!-- Add a CSRF token here when CSRF protection is implemented. -->
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}" autocomplete="email" required {% if not error %}autofocus{% endif %}>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required {% if error %}autofocus{% endif %}>
        <button type="submit">Log in</button>
    </form>
</body>
</html>
